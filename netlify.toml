# Netlify 빌드 설정 — 정적 사이트 (빌드 단계 없음)
[build]
  publish = "."

# 404 발생 시 메인으로
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

# 보안 헤더
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
